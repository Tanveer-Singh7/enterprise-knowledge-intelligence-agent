services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: eki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eki_support
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: